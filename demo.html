<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Class</h2>
    <script>
        //variable declaration is JS using var keyword.
        var myName ="ABESEC";
        document.write(myName);
        console.log(myName);
        function hello(){
            var abc="demo";
            console.log(abc);
        }
        hello();
        var myName ="AKTU";
        console.log(myName);
        //JSS execution using let and const keyword
        let msg= "Welcome to JSS";
        console.log(msg);
        msg = "thanks for visting!";
        console.log(msg);
    </script>
</body>
</html>
